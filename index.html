<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Kapellen 1919 e.V. — Spieler-Dashboard</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --accent-orange: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --green: #22c55e;
            --red: #ef4444;
            --blue: #3b82f6;
            --highlight-yellow: #facc15;
            --highlight-green-bg: rgba(34, 197, 94, 0.2);
            --highlight-green-text: #4ade80;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .app-sync-info {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px dashed var(--border-color);
            padding: 8px;
            border-radius: 8px;
        }

        .login-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            margin-top: 40px;
        }

        .login-card h2 { margin-top: 0; color: var(--accent-orange); }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
        .form-control {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-orange);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }

        #dashboardView {
            display: none;
        }

        .dashboard-header {
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        /* Hauptzeile: Buttons oben & saubere Trennung */
        .header-top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        /* Titelzeile mit Wappen links und rechts (analog zur Mannschafts-App) */
        .header-title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            text-align: center;
        }

        /* Exakt gleiche Wappengröße wie bei den Teams */
        .header-logo {
            height: 45px;
            max-height: 45px;
            width: auto;
            max-width: 50px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .dashboard-header h1 {
            font-size: 1.4rem;
            margin: 0;
            color: var(--accent-orange);
            text-align: center;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        .admin-filter-bar {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-filter-bar label {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--accent-orange);
            white-space: nowrap;
        }

        .team-section-title {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-orange);
            margin: 25px 0 12px 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-left: 3px solid var(--accent-orange);
            padding-left: 8px;
        }

        .player-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            margin-bottom: 24px;
        }

        .player-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .player-name {
            font-size: 1.6rem;
            font-weight: 800;
            margin: 0 0 4px 0;
            letter-spacing: -0.5px;
        }

        .player-club {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-orange);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .player-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .stats-section {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 16px;
        }

        .stats-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-orange);
            margin-bottom: 14px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 6px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-box label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
        }

        .stat-value.highlight-bg {
            background-color: var(--accent-orange);
            color: #000;
            display: inline-block;
            padding: 2px 10px;
            border-radius: 6px;
        }

        .win-bilanz { color: var(--green); }
        .loss-bilanz { color: var(--red); }
        .diff-pos { color: var(--green); font-size: 0.85rem; }
        .diff-neg { color: var(--red); font-size: 0.85rem; }
        .diff-zero { color: var(--text-muted); font-size: 0.85rem; }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: var(--border-color);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }
        .progress-fill-green { height: 100%; background-color: var(--green); }
        .progress-fill-blue { height: 100%; background-color: var(--blue); }

        .highlights-box {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: rgba(245, 158, 11, 0.05);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 12px;
            padding: 12px;
            margin-top: 16px;
            text-align: center;
        }

        .highlight-item span { display: block; font-size: 0.65rem; color: var(--text-muted); }
        .highlight-item strong { font-size: 1rem; color: var(--accent-orange); }

        .shortlegs-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            margin-top: 2px;
        }

        .shortleg-badge {
            font-size: 0.85rem;
            padding: 1px 6px;
            border-radius: 4px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-weight: bold;
        }

        .shortleg-badge.best-shortleg {
            background: var(--highlight-green-bg);
            border: 1px solid rgba(74, 222, 128, 0.5);
            color: var(--highlight-green-text);
            font-size: 0.95rem;
        }

        .scores-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
            text-align: center;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
        }
        .score-box span { display: block; font-size: 0.65rem; color: var(--text-muted); }
        .score-box strong { font-size: 0.95rem; color: var(--text-main); }

        .score-box.highlight-140 {
            background: rgba(250, 204, 21, 0.15);
            border: 1px solid rgba(250, 204, 21, 0.4);
            border-radius: 8px;
        }
        .score-box.highlight-140 span { color: #fef08a; font-weight: bold; }
        .score-box.highlight-140 strong { color: var(--highlight-yellow); font-size: 1.1rem; }

        .history-list {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .history-badge {
            min-width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
            color: #fff;
        }
        .history-win { background-color: var(--green); }
        .history-loss { background-color: var(--red); }

        .game-highlights-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .game-highlight-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            font-size: 0.8rem;
        }
        .game-highlight-card.best { border-color: rgba(34, 197, 94, 0.4); }
        .game-highlight-card.worst { border-color: rgba(239, 68, 68, 0.4); }
        .game-highlight-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .game-highlight-card.best .game-highlight-title { color: var(--green); }
        .game-highlight-card.worst .game-highlight-title { color: var(--red); }

        .action-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .action-btn:hover { color: var(--text-main); border-color: var(--text-main); background: rgba(255,255,255,0.05); }
        .action-btn.refresh-btn { color: var(--accent-orange); border-color: rgba(245, 158, 11, 0.4); }
        .action-btn.refresh-btn:hover { background: rgba(245, 158, 11, 0.1); border-color: var(--accent-orange); }
    </style>
</head>
<body>

<div class="container">
    <div class="app-sync-info">⚡ Datenpflege & Bereitstellung: Jürgen Schützendorf</div>

    <!-- LOGIN FORMULAR -->
    <div id="loginCard" class="login-card">
        <h2>Spieler-Login</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;">Bitte wähle deinen Namen aus und gib dein Passwort ein.</p>
        
        <div class="form-group">
            <label for="playerSelect">Spieler / Mannschaft</label>
            <select id="playerSelect" class="form-control">
                <option value="">-- Bitte wählen --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="playerPassword">Passwort</label>
            <input type="password" id="playerPassword" class="form-control" placeholder="Passwort eingeben...">
        </div>

        <button class="btn" onclick="handleLogin()">Einloggen</button>
        <div id="loginError" style="color: var(--red); font-size: 0.8rem; margin-top: 10px; display: none;">Falsches Passwort!</div>
    </div>

    <!-- DASHBOARD ANSICHT -->
    <div id="dashboardView">
        <div class="dashboard-header">
            <div class="header-top-bar">
                <div class="header-buttons">
                    <button id="refreshBtn" class="action-btn refresh-btn" onclick="refreshData()">🔄 Aktualisieren</button>
                    <button class="action-btn" onclick="logout()">Abmelden</button>
                </div>
            </div>
            
            <!-- Zeile für Logo links, Titel und Logo rechts nebeneinander -->
            <div class="header-title-row">
                <img src="https://lh3.googleusercontent.com/d/1PB4X2QrrMlaRlajQEWDtJxRP2c6VTsI5" alt="TV Kapellen Logo" class="header-logo">
                <h1 id="dashboardTitle">Übersicht</h1>
                <img src="https://lh3.googleusercontent.com/d/1PB4X2QrrMlaRlajQEWDtJxRP2c6VTsI5" alt="TV Kapellen Logo" class="header-logo">
            </div>
        </div>

        <!-- ADMIN MANNSCHAFTS-FILTER -->
        <div id="adminFilterContainer" class="admin-filter-bar" style="display: none;">
            <label for="adminTeamFilter">🎯 Ansicht filtern:</label>
            <select id="adminTeamFilter" class="form-control" style="margin-bottom: 0;" onchange="renderDashboard(sessionStorage.getItem('tvk_logged_in_user'))">
                <option value="all">Alle Mannschaften anzeigen</option>
                <option value="1. Mannschaft">1. Mannschaft</option>
                <option value="2. Mannschaft">2. Mannschaft</option>
                <option value="3. Mannschaft">3. Mannschaft</option>
                <option value="4. Mannschaft">4. Mannschaft</option>
            </select>
        </div>
        
        <div id="cardsContainer"></div>
    </div>
</div>

<script>
    const playersData = {
        "admin": { name: "Jürgen Schützendorf", mainTeam: "3. Mannschaft", password: "admin", isAdmin: true },
        "juergen_s": { name: "Jürgen Schützendorf", mainTeam: "3. Mannschaft", password: "2807", isAdmin: false },
        "weichert_n": { name: "Niklas Weichert", mainTeam: "3. Mannschaft", password: "003", isAdmin: false },
        "senger_w": { name: "Wolfram Senger", mainTeam: "3. Mannschaft", password: "0003", isAdmin: false },
        "ludger_s": { name: "Ludger Schledorn", mainTeam: "3. Mannschaft", password: "6767", isAdmin: false },
        "dominik_h": { name: "Dominik Helmke", mainTeam: "3. Mannschaft", password: "2508", isAdmin: false },
        "thomas_k": { name: "Thomas Kliver", mainTeam: "3. Mannschaft", password: "0003", isAdmin: false },
        "markus_g": { name: "Markus Ginsel", mainTeam: "3. Mannschaft", password: "0003", isAdmin: false },
        "andreas_d": { name: "Andreas Denner", mainTeam: "3. Mannschaft", password: "0003", isAdmin: false },
        "markus_l": { name: "Markus Lenz", mainTeam: "3. Mannschaft", password: "0003", isAdmin: false },
        "florian_h": { name: "Florian Hartwich", mainTeam: "3. Mannschaft", password: "0003", isAdmin: false },
        "michael_m": { name: "Michael Müller", mainTeam: "3. Mannschaft", password: "0003", isAdmin: false },
        "lars_n": { name: "Lars Neutag", mainTeam: "3. Mannschaft", password: "0003", isAdmin: false },
        "patrick_s": { name: "Patrick Seitz", mainTeam: "1. Mannschaft", password: "4711", isAdmin: false },
        "tim_s": { name: "Tim Siegel", mainTeam: "1. Mannschaft", password: "0000", isAdmin: false },
        "sascha_b": { name: "Sascha Bien", mainTeam: "1. Mannschaft", password: "0001", isAdmin: false },
        "stefan_m": { name: "Stefan Melcher", mainTeam: "1. Mannschaft", password: "0001", isAdmin: false },
        "jan_k": { name: "Jan Krabbe", mainTeam: "1. Mannschaft", password: "0001", isAdmin: false },
        "fabio_p": { name: "Fabio Padovano", mainTeam: "1. Mannschaft", password: "0001", isAdmin: false },
        "dirk_k": { name: "Dirk Kraus", mainTeam: "1. Mannschaft", password: "0001", isAdmin: false },
        "robert_g": { name: "Robert Geyer", mainTeam: "1. Mannschaft", password: "0001", isAdmin: false },
        "daniel_s": { name: "Daniel Simanowitz", mainTeam: "2. Mannschaft", password: "0002", isAdmin: false },
        "danny_v": { name: "Danny Voß", mainTeam: "2. Mannschaft", password: "0002", isAdmin: false },
        "markus_e": { name: "Markus Elgersma", mainTeam: "2. Mannschaft", password: "0002", isAdmin: false },
        "markus_t": { name: "Markus Thiele", mainTeam: "2. Mannschaft", password: "0002", isAdmin: false },
        "christian_s": { name: "Christian Schreiber", mainTeam: "2. Mannschaft", password: "0002", isAdmin: false },
        "dominik_herz": { name: "Dominik Herz", mainTeam: "2. Mannschaft", password: "0002", isAdmin: false },
        "thomas_f": { name: "Thomas Franzen", mainTeam: "2. Mannschaft", password: "0002", isAdmin: false },
        "philip_m": { name: "Philip Möller", mainTeam: "2. Mannschaft", password: "0002", isAdmin: false },
        "holger_w": { name: "Holger Weberpold", mainTeam: "2. Mannschaft", password: "0002", isAdmin: false },
        "britta_r": { name: "Britta Roghmans", mainTeam: "4. Mannschaft", password: "0004", isAdmin: false },
        "scott_j": { name: "Scott Jonen", mainTeam: "4. Mannschaft", password: "0004", isAdmin: false },
        "bjoern_m": { name: "Björn Mentzen", mainTeam: "4. Mannschaft", password: "0004", isAdmin: false },
        "lars_h": { name: "Lars Hufen", mainTeam: "4. Mannschaft", password: "0004", isAdmin: false },
        "jesper_n": { name: "Jesper Neutag", mainTeam: "4. Mannschaft", password: "0004", isAdmin: false },
        "brian_m": { name: "Brian Müller", mainTeam: "4. Mannschaft", password: "0004", isAdmin: false },
        "leon_o": { name: "Leon Overmann", mainTeam: "4. Mannschaft", password: "0004", isAdmin: false },
        "lucas_m": { name: "Lucas Mentzen", mainTeam: "4. Mannschaft", password: "0004", isAdmin: false }
    };

    let globalMatchesData = [];

    window.onload = async function() {
        const savedLoginKey = sessionStorage.getItem("tvk_logged_in_user");
        populatePlayerDropdown();

        await fetchAllSheetData();

        if (savedLoginKey && playersData[savedLoginKey]) {
            document.getElementById("loginCard").style.display = "none";
            document.getElementById("dashboardView").style.display = "block";
            renderDashboard(savedLoginKey);
        }
    };

    function populatePlayerDropdown() {
        const select = document.getElementById("playerSelect");
        select.innerHTML = '<option value="">-- Bitte wählen --</option>';
        const teams = ["1. Mannschaft", "2. Mannschaft", "3. Mannschaft", "4. Mannschaft", "Admin"];
        
        teams.forEach(teamName => {
            const groupPlayers = Object.entries(playersData).filter(([key, p]) => {
                if (teamName === "Admin") return p.isAdmin;
                return p.mainTeam === teamName && !p.isAdmin;
            });

            if (groupPlayers.length > 0) {
                let optgroup = document.createElement("optgroup");
                optgroup.label = teamName === "Admin" ? "Administration" : teamName;
                groupPlayers.forEach(([key, player]) => {
                    let option = document.createElement("option");
                    option.value = key;
                    option.textContent = player.name + (player.isAdmin ? " (Admin)" : "");
                    optgroup.appendChild(option);
                });
                select.appendChild(optgroup);
            }
        });
    }

    async function fetchAllSheetData() {
        globalMatchesData = [];
        const teamGids = [
            { name: "1. Mannschaft", gid: "2097702849" },
            { name: "2. Mannschaft", gid: "483923517" },
            { name: "3. Mannschaft", gid: "0" },
            { name: "4. Mannschaft", gid: "1132963048" }
        ];

        for (const team of teamGids) {
            const cacheBuster = new Date().getTime() + "_" + Math.random();
            const csvUrl = `https://docs.google.com/spreadsheets/d/e/2PACX-1vTdTOUA5sqMlTVxxUZWLn-ce3HNDvCbLfmLZIgT7EKJ0tYAT3OqZhx3T_BMvpgIwU5tDUxmjvUIRbHz/pub?output=csv&gid=${team.gid}&cb=` + cacheBuster;

            try {
                const response = await fetch(csvUrl, { cache: "no-store" });
                const csvText = await response.text();
                const parsedRows = parseCSV(csvText, team.name);
                globalMatchesData = globalMatchesData.concat(parsedRows);
            } catch (err) {
                console.log(`Konnte Daten für ${team.name} nicht laden:`, err);
            }
        }
    }

    async function refreshData() {
        const btn = document.getElementById("refreshBtn");
        btn.textContent = "⏳ Lade...";
        btn.disabled = true;

        await fetchAllSheetData();

        const savedLoginKey = sessionStorage.getItem("tvk_logged_in_user");
        if (savedLoginKey && playersData[savedLoginKey]) {
            renderDashboard(savedLoginKey);
        }

        btn.textContent = "🔄 Aktualisieren";
        btn.disabled = false;
    }

    function parseCSV(text, teamName) {
        let lines = text.split("\n");
        let result = [];
        if (lines.length < 2) return result;

        let headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim().toLowerCase());
        let colIndex = (name) => headers.findIndex(h => h.includes(name.toLowerCase()));

        let idxSpieltag = colIndex("spieltag");
        let idxDatum = colIndex("datum");
        let idxGegner = colIndex("gegner mannschaft");
        let idxBlock = colIndex("block");
        let idxSpieler = colIndex("spieler kapellen");
        let idxErgebnis = colIndex("ergebnis spiel");
        let idxAvg = colIndex("avg");
        let idxDarts = colIndex("darts");
        let idx180 = colIndex("180er");
        let idxHf = colIndex("hf");
        let idx60 = colIndex("60+");
        let idx80 = colIndex("80+");
        let idx100 = colIndex("100+");
        let idx140 = colIndex("140+");

        for (let i = 1; i < lines.length; i++) {
            let line = lines[i].trim();
            if (!line) continue;
            
            let cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            let cleanVal = (idx) => (idx !== -1 && cols[idx]) ? cols[idx].replace(/"/g, '').trim() : "";

            if (cols.length > 5) {
                result.push({
                    mannschaft: teamName,
                    spieltag: cleanVal(idxSpieltag),
                    datum: cleanVal(idxDatum),
                    gegnerMannschaft: cleanVal(idxGegner),
                    block: cleanVal(idxBlock),
                    spielerKapellen: cleanVal(idxSpieler),
                    ergebnisSpiel: cleanVal(idxErgebnis),
                    avg: cleanVal(idxAvg),
                    darts: cleanVal(idxDarts),
                    r180er: cleanVal(idx180),
                    hf: cleanVal(idxHf),
                    s60: cleanVal(idx60),
                    s80: cleanVal(idx80),
                    s100: cleanVal(idx100),
                    s140: cleanVal(idx140)
                });
            }
        }
        return result;
    }

    function handleLogin() {
        const selectedKey = document.getElementById("playerSelect").value;
        const passwordInput = document.getElementById("playerPassword").value;
        const errorDiv = document.getElementById("loginError");

        if (!selectedKey || !playersData[selectedKey]) {
            errorDiv.textContent = "Bitte wähle einen Spieler aus.";
            errorDiv.style.display = "block";
            return;
        }

        const player = playersData[selectedKey];
        
        if (passwordInput === player.password || (player.isAdmin && passwordInput === "admin")) {
            errorDiv.style.display = "none";
            sessionStorage.setItem("tvk_logged_in_user", selectedKey);

            document.getElementById("loginCard").style.display = "none";
            document.getElementById("dashboardView").style.display = "block";
            
            renderDashboard(selectedKey);
        } else {
            errorDiv.textContent = "Falsches Passwort!";
            errorDiv.style.display = "block";
        }
    }

    function renderDashboard(loggedInKey) {
        const container = document.getElementById("cardsContainer");
        container.innerHTML = "";

        const loggedInPlayer = playersData[loggedInKey];
        const titleEl = document.getElementById("dashboardTitle");
        const adminFilterContainer = document.getElementById("adminFilterContainer");

        if (loggedInPlayer.isAdmin) {
            adminFilterContainer.style.display = "flex";
            const selectedTeamFilter = document.getElementById("adminTeamFilter").value;
            
            titleEl.textContent = selectedTeamFilter === "all" 
                ? "Admin-Dashboard — Alle Mannschaften" 
                : `Admin-Dashboard — ${selectedTeamFilter}`;

            const teamOrder = ["1. Mannschaft", "2. Mannschaft", "3. Mannschaft", "4. Mannschaft"];
            
            teamOrder.forEach(teamName => {
                if (selectedTeamFilter !== "all" && selectedTeamFilter !== teamName) return;

                const teamPlayerKeys = Object.keys(playersData).filter(key => {
                    if (key === "admin") return false;
                    return playersData[key].mainTeam === teamName;
                });

                if (teamPlayerKeys.length > 0) {
                    let sectionTitle = document.createElement("div");
                    sectionTitle.className = "team-section-title";
                    sectionTitle.textContent = teamName;
                    container.appendChild(sectionTitle);

                    teamPlayerKeys.forEach(key => {
                        container.appendChild(createPlayerCardElement(key));
                    });
                }
            });
        } else {
            adminFilterContainer.style.display = "none";
            titleEl.textContent = "Deine Spielerkarte";
            container.appendChild(createPlayerCardElement(loggedInKey));
        }
    }

    function createPlayerCardElement(playerKey) {
        const player = playersData[playerKey];
        
        let cardDiv = document.createElement("div");
        cardDiv.className = "player-card";

        let targetName = player.name;
        let mainTeam = player.mainTeam;

        let mainStats = { matches: 0, won: 0, lost: 0, legsWon: 0, legsLost: 0, avgs: [], highFinish: 0, count180: 0, allShortLegs: [], totalDartsWonLegs: 0, s60: 0, s80: 0, s100: 0, s140: 0 };
        let subStats = { teamName: "", matches: 0, won: 0, lost: 0, legsWon: 0, legsLost: 0, avgs: [] };
        
        let matchHistory = [];

        globalMatchesData.forEach(match => {
            if (match.block && match.block.toLowerCase().includes('doppel')) return;

            if (match.spielerKapellen === targetName) {
                let isSub = (!player.isAdmin && match.mannschaft !== mainTeam);
                let currentStats = isSub ? subStats : mainStats;

                if (isSub) subStats.teamName = match.mannschaft;
                currentStats.matches++;

                let matchLegsWon = 0;
                let isWon = false;
                if (match.ergebnisSpiel) {
                    let parts = match.ergebnisSpiel.split(":");
                    let gLegs = parseInt(parts[0]) || 0;
                    let vLegs = parseInt(parts[1]) || 0;
                    currentStats.legsWon += gLegs;
                    currentStats.legsLost += vLegs;
                    if (gLegs > vLegs) {
                        currentStats.won++;
                        isWon = true;
                    } else {
                        currentStats.lost++;
                    }

                    if (!isSub || player.isAdmin) {
                        matchLegsWon = gLegs;
                    }
                }

                let matchAvg = parseFloat(match.avg) || 0;
                if (match.avg) {
                    currentStats.avgs.push(matchAvg);
                }

                if (!isSub || player.isAdmin) {
                    matchHistory.push({
                        spieltag: match.spieltag || "",
                        datum: match.datum || "",
                        gegner: match.gegnerMannschaft || "Unbekannt",
                        ergebnis: match.ergebnisSpiel || "-",
                        avg: matchAvg,
                        won: isWon
                    });

                    let matchDartsList = [];
                    if (match.darts) {
                        match.darts.split(",").forEach(dStr => {
                            let d = parseInt(dStr.trim());
                            if (!isNaN(d) && d > 0) {
                                matchDartsList.push(d);
                                if (d <= 18) {
                                    mainStats.allShortLegs.push(d);
                                }
                            }
                        });
                    }

                    if (matchLegsWon > 0 && matchDartsList.length > 0) {
                        for (let i = 0; i < Math.min(matchLegsWon, matchDartsList.length); i++) {
                            mainStats.totalDartsWonLegs += matchDartsList[i];
                        }
                    }

                    mainStats.count180 += parseInt(match.r180er) || 0;
                    let hf = parseInt(match.hf) || 0;
                    if (hf > mainStats.highFinish) mainStats.highFinish = hf;

                    mainStats.s60 += parseInt(match.s60) || 0;
                    mainStats.s80 += parseInt(match.s80) || 0;
                    mainStats.s100 += parseInt(match.s100) || 0;
                    mainStats.s140 += parseInt(match.s140) || 0;
                }
            }
        });

        mainStats.allShortLegs.sort((a, b) => a - b);
        let bestShortLeg = mainStats.allShortLegs.length > 0 ? Math.min(...mainStats.allShortLegs) : 999;

        let totalMainLegs = mainStats.legsWon + mainStats.legsLost;
        let legDiff = mainStats.legsWon - mainStats.legsLost;
        let legDiffClass = legDiff > 0 ? "diff-pos" : (legDiff < 0 ? "diff-neg" : "diff-zero");
        let legDiffFormatted = legDiff > 0 ? `(+${legDiff})` : `(${legDiff})`;

        let winRate = mainStats.matches > 0 ? ((mainStats.won / mainStats.matches) * 100).toFixed(1) : 0;
        let legRate = totalMainLegs > 0 ? ((mainStats.legsWon / totalMainLegs) * 100).toFixed(1) : 0;
        let avgMain = mainStats.avgs.length > 0 ? (mainStats.avgs.reduce((a,b)=>a+b, 0) / mainStats.avgs.length).toFixed(2) : "0.00";
        
        let dartsPerLeg = (mainStats.legsWon > 0 && mainStats.totalDartsWonLegs > 0) 
            ? Math.round(mainStats.totalDartsWonLegs / mainStats.legsWon) 
            : "-";

        let shortLegsHtml = "-";
        if (mainStats.allShortLegs.length > 0) {
            shortLegsHtml = `<div class="shortlegs-container">` + 
                mainStats.allShortLegs.map(d => {
                    let isBest = (d === bestShortLeg);
                    return `<span class="shortleg-badge ${isBest ? 'best-shortleg' : ''}">${d}</span>`;
                }).join('') + 
                `</div>`;
        }

        let historyHtml = "-";
        if (matchHistory.length > 0) {
            let recentMatches = matchHistory.slice(-8);
            historyHtml = `<div class="history-list">` + 
                recentMatches.map(m => {
                    let cls = m.won ? "history-win" : "history-loss";
                    let titleText = `${m.gegner}: ${m.ergebnis} (Avg: ${m.avg})`;
                    let letter = m.won ? "S" : "N";
                    return `<div class="history-badge ${cls}" title="${titleText}">${letter}</div>`;
                }).join('') + `</div>`;
        }

        let bestGameHtml = "<div style='color: var(--text-muted);'>Noch keine Spiele vorhanden.</div>";
        let worstGameHtml = "<div style='color: var(--text-muted);'>Noch keine Spiele vorhanden.</div>";

        if (matchHistory.length > 0) {
            let validGames = matchHistory.filter(m => m.avg > 0);
            if (validGames.length > 0) {
                let sortedByAvgDesc = [...validGames].sort((a, b) => b.avg - a.avg);
                let best = sortedByAvgDesc[0];

                let evaluatedGames = validGames.map(m => {
                    let parts = m.ergebnis.split(':');
                    let ownLegs = parts.length === 2 ? parseInt(parts[0]) || 0 : 0;
                    let oppLegs = parts.length === 2 ? parseInt(parts[1]) || 0 : 0;
                    let isLoss = ownLegs < oppLegs;
                    return { ...m, isLoss, ownLegs, oppLegs };
                });

                evaluatedGames.sort((a, b) => {
                    if (a.isLoss !== b.isLoss) {
                        return a.isLoss ? -1 : 1;
                    }
                    return a.avg - b.avg;
                });

                let worst = evaluatedGames[0];

                bestGameHtml = `
                    <div style="font-weight: bold; color: var(--text-main); margin-bottom: 2px;">${best.gegner}</div>
                    <div style="display: flex; justify-content: space-between; color: var(--text-muted);">
                        <span>${best.spieltag || best.datum || 'Match'}</span>
                        <strong style="color: var(--green);">Avg: ${best.avg.toFixed(2)} (${best.ergebnis})</strong>
                    </div>
                `;

                worstGameHtml = `
                    <div style="font-weight: bold; color: var(--text-main); margin-bottom: 2px;">${worst.gegner}</div>
                    <div style="display: flex; justify-content: space-between; color: var(--text-muted);">
                        <span>${worst.spieltag || worst.datum || 'Match'}</span>
                        <strong style="color: var(--red);">Avg: ${worst.avg.toFixed(2)} (${worst.ergebnis})</strong>
                    </div>
                `;
            }
        }

        let subHtml = "";
        if (!player.isAdmin && subStats.matches > 0) {
            let avgSub = subStats.avgs.length > 0 ? (subStats.avgs.reduce((a,b)=>a+b, 0) / subStats.avgs.length).toFixed(2) : "0.00";
            subHtml = `
                <div class="stats-section">
                    <div class="stats-title">Aushilfseinsatz — ${subStats.teamName}</div>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <label>Matches</label>
                            <div class="stat-value">${subStats.matches}</div>
                            <label style="margin-top: 10px;">Bilanz (G : V)</label>
                            <div class="stat-value"><span class="win-bilanz">${subStats.won}</span> : <span class="loss-bilanz">${subStats.lost}</span></div>
                        </div>
                        <div class="stat-box">
                            <label>Avg</label>
                            <div class="stat-value"><span class="highlight-bg">${avgSub}</span></div>
                            <label style="margin-top: 10px;">Legs (Gew : Verl)</label>
                            <div class="stat-value" style="font-size: 1.2rem; margin-top: 4px;">${subStats.legsWon} : ${subStats.legsLost}</div>
                        </div>
                    </div>
                </div>`;
        }

        cardDiv.innerHTML = `
            <div class="player-header">
                <h2 class="player-name">${player.name}</h2>
                <div class="player-club">TV Kapellen 1919 e.V.</div>
                <div class="player-meta">Saison 2026/2027 &bull; Stammteam: ${player.mainTeam}</div>
            </div>

            <div class="stats-section">
                <div class="stats-title">${player.isAdmin ? "Gesamtübersicht — Leistungsdaten (Alle Teams)" : player.mainTeam + " — Leistungsdaten"}</div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <label>Matches Gesamt</label>
                        <div class="stat-value">${mainStats.matches}</div>
                        <label style="margin-top: 10px;">Bilanz (G : V)</label>
                        <div class="stat-value"><span class="win-bilanz">${mainStats.won}</span> : <span class="loss-bilanz">${mainStats.lost}</span></div>
                        <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">Win-Rate (${winRate}%)</div>
                        <div class="progress-bar"><div class="progress-fill-green" style="width: ${winRate}%;"></div></div>
                    </div>
                    <div class="stat-box">
                        <label>Avg (Punkteschnitt)</label>
                        <div class="stat-value"><span class="highlight-bg">${avgMain}</span></div>
                        <label style="margin-top: 10px;">Legs (Gew : Verl)</label>
                        <div class="stat-value" style="font-size: 1.2rem; margin-top: 4px;">${mainStats.legsWon} : ${mainStats.legsLost} <span class="${legDiffClass}">${legDiffFormatted}</span></div>
                        <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">Leg-Rate (${legRate}%)</div>
                        <div class="progress-bar"><div class="progress-fill-blue" style="width: ${legRate}%;"></div></div>
                    </div>
                </div>
            </div>

            <div class="stats-section">
                <div class="stats-title">Saisonverlauf / Trend (Letzten 5 Spiele)</div>
                <div>${historyHtml}</div>
            </div>

            <div class="stats-section">
                <div class="stats-title">Top- & Flop-Spiel (nach Avg & Ergebnis)</div>
                <div class="game-highlights-grid">
                    <div class="game-highlight-card best">
                        <div class="game-highlight-title">⭐ Bestes Spiel</div>
                        ${bestGameHtml}
                    </div>
                    <div class="game-highlight-card worst">
                        <div class="game-highlight-title">⚠️ Schwächstes Spiel</div>
                        ${worstGameHtml}
                    </div>
                </div>
            </div>

            ${subHtml}

            <div class="highlights-box">
                <div class="highlight-item">
                    <span>High-Finish</span>
                    <strong>${mainStats.highFinish > 0 ? mainStats.highFinish : "-"}</strong>
                </div>
                <div class="highlight-item">
                    <span>180er</span>
                    <strong>${mainStats.count180}</strong>
                </div>
                <div class="highlight-item">
                    <span>Darts / Leg (Gew.)</span>
                    <strong>${dartsPerLeg}</strong>
                </div>
                <div class="highlight-item">
                    <span>Short Legs (&le; 18)</span>
                    <div style="margin-top: 2px;">${shortLegsHtml}</div>
                </div>
            </div>

            <div class="scores-grid">
                <div class="score-box"><span>60+</span><strong>${mainStats.s60}</strong></div>
                <div class="score-box"><span>80+</span><strong>${mainStats.s80}</strong></div>
                <div class="score-box"><span>100+</span><strong>${mainStats.s100}</strong></div>
                <div class="score-box highlight-140"><span>140+</span><strong>${mainStats.s140}</strong></div>
            </div>
        `;

        return cardDiv;
    }

    function logout() {
        sessionStorage.removeItem("tvk_logged_in_user");
        document.getElementById("dashboardView").style.display = "none";
        document.getElementById("loginCard").style.display = "block";
        document.getElementById("playerPassword").value = "";
    }
</script>

</body>
</html>
